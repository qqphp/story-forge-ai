# Replace storyforge.example.com and the certificate paths before installation.
server {
    listen 80;
    server_name storyforge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name storyforge.example.com;
    ssl_certificate /etc/letsencrypt/live/storyforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyforge.example.com/privkey.pem;

    root /opt/storyforge-ai/dist;
    index index.html;

    location ~ ^/(api|media|voice-samples)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
